<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Typing Test</title>
<script>
(function(){
  function gc(n){var m=document.cookie.match('(?:^|; )'+n+'=([^;]*)');return m?decodeURIComponent(m[1]):null;}
  var t=gc('app_theme');
  if(['dark','light','solarized'].indexOf(t)<0)t='dark';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root[data-theme=dark]{--bg:#0d1117;--bg2:#161b22;--fg:#c9d1d9;--dim:#6e7681;--ok:#3fb950;--bad:#f85149;--acc:#58a6ff;}
:root[data-theme=light]{--bg:#ffffff;--bg2:#f6f8fa;--fg:#1f2328;--dim:#8c959f;--ok:#1a7f37;--bad:#cf222e;--acc:#0969da;}
:root[data-theme=solarized]{--bg:#002b36;--bg2:#073642;--fg:#839496;--dim:#586e75;--ok:#2aa198;--bad:#dc322f;--acc:#b58900;}
:root{--pico-background-color:var(--bg);--pico-color:var(--fg);--pico-card-background-color:var(--bg2);
  --pico-form-element-background-color:var(--bg2);--pico-form-element-color:var(--fg);--pico-primary:var(--acc);}
body{background:var(--bg);color:var(--fg);}
#text{font:var(--fs,1.5rem)/var(--lh,2.2rem) ui-monospace,Consolas,monospace;background:var(--bg2);padding:1.2rem;border-radius:8px;
  user-select:none;white-space:pre-wrap;word-break:normal;overflow-wrap:normal;cursor:text}
#text{max-width:74ch;height:calc(7*var(--lh,2.2rem) + 2.4rem);overflow-y:auto;margin:0 auto}
#text .w{display:inline-block;white-space:nowrap}
#text span{color:var(--dim)} #text .ok{color:var(--ok)} #text .bad{color:var(--bad);background:rgba(248,81,73,.2)}
#text .cur{border-left:2px solid var(--acc);margin-left:-2px}
.log{margin-top:1.5rem;font-size:.9rem}.log table{width:100%}.log .best td{color:var(--ok);font-weight:bold}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:1rem 0;font-size:1.1rem}
.stats b{color:var(--acc);font-size:1.4rem}
.bar{display:flex;gap:1rem;align-items:end;flex-wrap:wrap}
.bar label{margin:0}
#hid{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main class="container">

</div>

</div>

<script>
const DATA = {"en": ["Imagine you are an experienced Ethereum developer tasked with creating a smart contract for a blockchain messenger. The objective is to save messages on the blockchain, making them readable (public) to everyone, writable (private) only to the person who deployed the contract, and to count how many times the message was updated.", "I want you to act as a linux terminal. I will type commands and you will reply with what the terminal should show. I want you to only reply with the terminal output inside one unique code block, and nothing else. do not write explanations. do not type commands unless I instruct you to do so.", "I want you to replace my simplified A0-level words and sentences with more beautiful and elegant, upper level English words and sentences. Keep the meaning same, but make them more literary. I want you to only reply the correction, the improvements and nothing else, do not write explanations.", "I want you to act as an interviewer. I will be the candidate and you will ask me the interview questions for the Position:Software Developer position. I want you to only reply as the interviewer. Do not write all the conversation at once. I want you to only do the interview with me. Ask me the questions and wait for my answers.", "I want you to act as a javascript console. I will type commands and you will reply with what the javascript console should show. I want you to only reply with the terminal output inside one unique code block, and nothing else. do not write explanations. do not type commands unless I instruct you to do so.", "I want you to act as a text based excel. you'll only reply me the text-based 10 rows excel sheet with row numbers and cell letters as columns (A to L). First column header should be empty to reference row number. I will tell you what to write into cells and you'll reply only the result of excel table as text, and nothing else.", "I want you to act as an English pronunciation assistant for Mother Language:Turkish speaking people. I will write you sentences and you will only answer their pronunciations, and nothing else. The replies must not be translations of my sentence but only pronunciations.", "I want you to act as a spoken English teacher and improver. I will speak to you in English and you will reply to me in English to practice my spoken English. I want you to keep your reply neat, limiting the reply to 100 words. I want you to strictly correct my grammar mistakes, typos, and factual errors.", "I want you to act as a travel guide. I will write you my location and you will suggest a place to visit near my location. In some cases, I will also give you the type of places I will visit. You will also suggest me places of similar type that are close to my first location.", "I want you to act like character from series . I want you to respond and answer like character using the tone, manner and vocabulary character would use. Do not write any explanations. Only answer like character . You must know all of the knowledge of character . My first sentence is \"Hi character .", "I want you to act as an advertiser. You will create a campaign to promote a product or service of your choice. You will choose a target audience, develop key messages and slogans, select the media channels for promotion, and decide on any additional activities needed to reach your goals.", "I want you to act as a storyteller. You will come up with entertaining stories that are engaging, imaginative and captivating for the audience. It can be fairy tales, educational stories or any other type of stories which has the potential to capture people's attention and imagination.", "You should be knowledgeable of football terminology, tactics, players teams involved in each match, and focus primarily on providing intelligent commentary rather than just narrating play-by-play. My first request is \"I'm watching Manchester United vs Chelsea - provide commentary for this match.", "I want you to act as a composer. I will provide the lyrics to a song and you will create music for it. This could include using various instruments or tools, such as synthesizers or samplers, in order to create melodies and harmonies that bring the lyrics to life.", "I want you to act as a debater. I will provide you with some topics related to current events and your task is to research both sides of the debates, present valid arguments for each side, refute opposing points of view, and draw persuasive conclusions based on evidence.", "I want you to act as a debate coach. I will provide you with a team of debaters and the motion for their upcoming debate. Your goal is to prepare the team for success by organizing practice rounds that focus on persuasive speech, effective timing strategies, refuting opposing arguments, and drawing in-depth conclusions from evidence provided.", "I want you to act as a screenwriter. You will develop an engaging and creative script for either a feature length film, or a Web Series that can captivate its viewers. Start with coming up with interesting characters, the setting of the story, dialogues between the characters etc.", "I want you to act as a novelist. You will come up with creative and captivating stories that can engage readers for long periods of time. You may choose any genre such as fantasy, romance, historical fiction and so on - but the aim is to write something that has an outstanding plotline, engaging characters and unexpected climaxes.", "I want you to act as a movie critic. You will develop an engaging and creative movie review. You can cover topics like plot, themes and tone, acting and characters, direction, score, cinematography, production design, special effects, editing, pace, dialog. The most important aspect though is to emphasize how the movie has made you feel.", "I want you to act as a motivational speaker. Put together words that inspire action and make people feel empowered to do something beyond their abilities. You can talk about any topics but the aim is to make sure what you say resonates with your audience, giving them an incentive to work on their goals and strive for better possibilities.", "I want you to act as a philosophy teacher. I will provide some topics related to the study of philosophy, and it will be your job to explain these concepts in an easy-to-understand manner. This could include providing examples, posing questions or breaking down complex ideas into smaller pieces that are easier to comprehend.", "I want you to act as a philosopher. I will provide some topics or questions related to the study of philosophy, and it will be your job to explore these concepts in depth. This could involve conducting research into various philosophical theories, proposing new ideas or finding creative solutions for solving complex problems.", "I want you to act as a math teacher. I will provide some mathematical equations or concepts, and it will be your job to explain them in easy-to-understand terms. This could include providing step-by-step instructions for solving a problem, demonstrating various techniques with visuals or suggesting online resources for further study.", "I want you to act as an AI writing tutor. I will provide you with a student who needs help improving their writing and your task is to use artificial intelligence tools, such as natural language processing, to give the student feedback on how they can improve their composition.", "I want you to act as a UX UI developer. I will provide some details about the design of an app, website or other digital product, and it will be your job to come up with creative ways to improve its user experience. This could involve creating prototyping prototypes, testing different designs and providing feedback on what works best.", "I want you to act as a recruiter. I will provide some information about job openings, and it will be your job to come up with strategies for sourcing qualified applicants. This could include reaching out to potential candidates through social media, networking events or even attending career fairs in order to find the best people for each role.", "I want you to act as a etymologist. I will give you a word and you will research the origin of that word, tracing it back to its ancient roots. You should also provide information on how the meaning of the word has changed over time, if applicable. My first request is \"I want to trace the origins of the word 'pizza'.", "You should use your own experiences, thoughtfully explain why something is important, back up claims with facts, and discuss potential solutions for any problems presented in the story. My first request is \"I want to write an opinion piece about climate change.", "I want you to act as a magician. I will provide you with an audience and some suggestions for tricks that can be performed. Your goal is to perform these tricks in the most entertaining way possible, using your skills of deception and misdirection to amaze and astound the spectators. My first request is \"I want you to make my watch disappear!", "I want you to act as a career counselor. I will provide you with an individual looking for guidance in their professional life, and your task is to help them determine what careers they are most suited for based on their skills, interests and experience.", "I want you to act as a pet behaviorist. I will provide you with a pet and their owner and your goal is to help the owner understand why their pet has been exhibiting certain behavior, and come up with strategies for helping the pet adjust accordingly.", "I want you to act as a personal trainer. I will provide you with all the information needed about an individual looking to become fitter, stronger and healthier through physical training, and your role is to devise the best plan for that person depending on their current fitness level, goals and lifestyle habits.", "You should use your knowledge of cognitive behavioral therapy, meditation techniques, mindfulness practices, and other therapeutic methods in order to create strategies that the individual can implement in order to improve their overall wellbeing. My first request is \"I need someone who can help me manage my depression symptoms.", "I want you to act as a logistician. I will provide you with details on an upcoming event, such as the number of people attending, the location, and other relevant factors. Your role is to develop an efficient logistical plan for the event that takes into account allocating resources beforehand, transportation facilities, catering services etc.", "I want you to act as a dentist. I will provide you with details on an individual looking for dental services such as x-rays, cleanings, and other treatments. Your role is to diagnose any potential issues they may have and suggest the best course of action depending on their condition.", "I want you to act as a web design consultant. I will provide you with details related to an organization needing assistance designing or redeveloping their website, and your role is to suggest the most suitable interface and features that can enhance user experience while also meeting the company's business goals.", "I want you to act as an AI assisted doctor. I will provide you with details of a patient, and your task is to use the latest artificial intelligence tools such as medical imaging software and other machine learning programs in order to diagnose the most likely cause of their symptoms.", "I want you to act as an accountant and come up with creative ways to manage finances. You'll need to consider budgeting, investment strategies and risk management when creating a financial plan for your client. In some cases, you may also need to provide advice on taxation laws and regulations in order to help them maximize their profits.", "I require someone who can suggest delicious recipes that includes foods which are nutritionally beneficial but also easy not time consuming enough therefore suitable for busy people like us among other factors such as cost effectiveness so overall dish ends up being healthy yet economical at same time!", "Want somebody experienced enough to distinguish between various tea types based upon flavor profile tasting them carefully then reporting it back in jargon used by connoisseurs in order figure out what's unique about any given infusion among rest therefore determining its worthiness high grade quality !", "I want you to act as an interior decorator. Tell me what kind of theme and design approach should be used for a room of my choice; bedroom, hall etc., provide suggestions on color schemes, furniture placement and other decorative options that best suit said theme design approach in order to enhance aesthetics and comfortability within the space .", "I want you to act as a self-help book. You will provide me advice and tips on how to improve certain areas of my life, such as relationships, career development or financial planning. For example, if I am struggling in my relationship with a significant other, you could suggest helpful communication techniques that can bring us closer together.", "I want you to act as a gnomist. You will provide me with fun, unique ideas for activities and hobbies that can be done anywhere. For example, I might ask you for interesting yard design suggestions or creative ways of spending time indoors when the weather is not favourable.", "I want you to act as an aphorism book. You will provide me with wise advice, inspiring quotes and meaningful sayings that can help guide my day-to-day decisions. Additionally, if necessary, you could suggest practical methods for putting this advice into action or other related themes.", "I want you to act as a text based adventure game. I will type commands and you will reply with a description of what the character sees. I want you to only reply with the game output inside one unique code block, and nothing else. do not write explanations. do not type commands unless I instruct you to do so.", "Caveat Emptor: After issuing this prompt you should then do something like start a docker container with docker run -it ubuntu:latest bin bash and type the commands the AI gives you in, and paste the output back... obviously you shouldn't run any commands that will damage anything or break any laws, etc.", "I want to act as a Statistician. I will provide you with details related with statistics. You should be knowledge of statistics terminology, statistical distributions, confidence interval, probabillity, hypothesis testing and statistical charts. My first request is \"I need help calculating how many million banknotes are in active use in the world\".", "CONTEXT: We are going to create one of the best AI prompts ever written. The best prompts include comprehensive details to fully inform the Large Language Model (LLM) of the prompt's: goals, required areas of expertise, domain knowledge, preferred format, target audience, references, examples, and the best approach to accomplish the objective.", "I want you to act as an instructor in a school, teaching algorithms to beginners. You will provide code examples using python programming language. First, start briefly explaining what an algorithm is, and continue giving simple examples, including bubble sort and quick sort. Later, wait for my prompt for additional questions.", "I want you to act as a SQL terminal in front of an example database. The database contains tables named \"Products\", \"Users\", \"Orders\" and \"Suppliers\". I will type queries and you will reply with what the terminal would show. I want you to reply with a table of query results in a single code block, and nothing else. Do not write explanations."], "es": ["Escribe un esquema de campania de marketing utilizando el marco 'Storyboard' para describir los elementos clave de una historia sobre nuestro producto servicio . Incluye al protagonista , conflicto y resolucion , y utiliza estos elementos para crear una narrativa convincente que conecte con el perfil del cliente ideal .", "Cambia el tono de tu texto. Prompt: \"Cambia el tono del texto a continuacion para que sea mas Directo, Formal, Informal, Sincero, Sarcastico, Amable, Asertivo, Persuasivo, Apasionado, Profesional, Informal Serio, Alegre, Conversacional, Serio : Pegar texto", "Podrias ayudarme a redactar un resumen de perfil de LinkedIn atractivo y eficaz que muestre mis habilidades y experiencia para un puesto de titulo del puesto en industria ? Quiero asegurarme de que refleje con precision mi propuesta de valor unica y capte la atencion de los posibles empleadores.", "Trabajar como consola de Javascript. Prompt: \"Quiero que actues como una consola de Javascript. Escribire comandos y tu responderas con lo que deberia mostrar la consola. Quiero que solo respondas con la salida de terminal dentro de un unico bloque de codigo, y nada mas.", "Crear una estrategia exitosa de lanzamiento de producto. Prompt: \" Inserte una breve descripcion de su producto y publico objetivo . Guiame en el desarrollo de una estrategia de lanzamiento de producto utilizando la Formula de Lanzamiento de Producto para generar interes y ventas\".", "La audiencia objetivo para este ebook es demografia industria , y la escritura debe estar orientada hacia esta audiencia. El ebook deberia estar estructurado de manera logica y coherente, con encabezados y subencabezados claros que faciliten su navegacion y seguimiento.", "La escritura debe ser clara, concisa y bien investigada, con un enfoque en proporcionar a los lectores ideas practicas y asesoramiento practico. Todas las afirmaciones hechas en el ebook deben ser respaldadas por fuentes creibles, y cualquier estadistica o dato presentado debe ser citado adecuadamente.", "En terminos de formato, el ebook debe estar diseniado de manera visualmente atractiva, prestando atencion al uso de imagenes, graficos y otros ayudas visuales. El disenio debe estar optimizado para la legibilidad, con un uso apropiado de los tamanios de fuente, estilos y espaciado.", "Puedes sugerirme algunas ideas creativas de disenio que resuenen con mi publico objetivo demografico e impulsen las ventas aumenten el compromiso \" \"Necesito una imagen de producto promocional que destaque las ventajas caracteristicas de mi producto creando una sensacion de urgencia incentive a compartirlo en las redes sociales .", "Cada resumen debe contener una oracion con el hallazgo principal, junto con 5 vinietas adicionales.\" \"Busca patrones comunes en las fuentes. Formula una declaracion de tesis cohesiva y convincente basada en los hallazgos encontrados.\" \"Crea un esquema detallado para un trabajo de investigacion basado en la tesis y las fuentes anteriores.", "Cuales son los errores comunes que comete una persona en el camino para convertirse en carrera soniada ? Proporciona instrucciones paso a paso sobre como evitar esos errores, un camino profesional detallado con duracion y las mejores fuentes para aprender.", "Actua como un Gerente de Redes Sociales con experiencia en aumentar audiencias para cuentas de marcas pequenias y grandes. Proporciona un plan paso a paso basado en la plataforma de LinkedIn para llegar a 1000 seguidores y luego a 10000 seguidores. Crecimiento organico con alta calidad de contenido.", "Necesitamos desarrollar especificaciones tecnicas para nuestro nuevo producto de software. Podrias proporcionar orientacion sobre las CARACTERISTICAS , RENDIMIENTO y MEJORES PRACTICAS que deben incluirse en la especificacion? Por favor, incluye tambien cualquier NORMA DE LA INDUSTRIA relevante que debamos seguir.", "Por favor, genera una especificacion tecnica para el producto NOMBRE DEL PRODUCTO , incluyendo detalles sobre la FUNCIONALIDAD , REQUISITOS TECNICOS y RENDIMIENTO que deben cumplirse. Por favor, tambien incluye cualquier NORMA relevante que deba ser seguida.", "Asesor de carrera: \"Quiero que actues como asesor de carrera. Te proporcionare una persona que busca orientacion en su vida profesional, y tu tarea es ayudarlo a determinar para que carreras es mas adecuado en funcion de sus habilidades y experiencia.", "Como narrador: \"Quiero que actues como narrador. Propondras historias entretenidas que atraigan a la audiencia. Pueden ser cuentos de hadas, historias educativas o cualquier otro tipo de historias que tengan el potencial de captar la atencion de las personas.", "Indicacion de anunciante: \"Quiero que actues como anunciante. Crearas una campania para promocionar un producto o servicio . Elegiras un publico objetivo, desarrollaras mensajes y esloganes clave y seleccionaras los canales de medios para la promocion.", "Puedes proporcionar un plan detallado integral para la estrategia de marketing para un establecimiento (.........) especializado (............) ubicado en (...) Te quiero compartir las siguientes ordenes: este plan es lo mas claro e informativo posible a partir de tu analisis de los datos de transmision y lo mas detallado posible.", "Fomenta el aprendizaje mediante la ensenianza (tecnica de Feynman). Prompt: \"Ayudame a explicar tema o habilidad en terminos simples como si estuviera enseniando a un ninio pequenio, para garantizar una comprension profunda y la capacidad de comunicarse de manera efectiva", "Proporciona una lista de numero foros en linea o grupos de redes sociales donde nuestro publico objetivo esta discutiendo activamente temas relevantes para nuestro producto servicio , y sugiera formas en que podemos interactuar con ellos para obtener informacion y promover nuestra marca.", "Crea una lluvia de ideas sobre una estrategia de marketing de contenido para atraer publico objetivo a nuestro sitio web . La empresa esta buscando aumentar el trafico al sitio web y generar clientes potenciales. Tu tarea es desarrollar una estrategia de marketing de contenido que atraiga al publico objetivo.", "Quiero mejorar la tasa de conversion de mi sitio web, pero no se por donde empezar. Puede proporcionar algunos consejos para crear paginas de destino atractivas y faciles de usar que fomenten llamado a la accion , prueba social y propuesta de valor ?", "Mejora tu modelo de negocio utilizando IA: \"Analiza negocio y modelo de negocio . Considera el espacio de mercado y encuentra las fallas que podrian hacer que los negocios fracasen o se ralenticen. Actualiza el modelo de negocio para resolver todas las fallas que encuentres", "Simula una conversacion de ventas: \"Crea una conversacion entre dos personas, Juan y Roberto. Juan es duenio de un negocio, y Roberto es un genio del marketing. Ahora muestra exactamente como se desarrolla esta conversacion de ventas desde el principio hasta el final", "Desarrolla tu Estrategia de Producto: \"Crea una estrategia de marketing para mi producto . Tengo un presupuesto de marketing de aproximadamente presupuesto disponible y necesito llegar a publico objetivo . Construye una tabla con las expectativas de retorno de inversion (ROI) por canal", "Actua como un guionista: \"Quiero que desarrolles una serie de television cautivadora que atrape a los espectadores de principio a fin. Haz que los personajes sean interesantes dandoles historias complejas, crea una trama adecuada y tambien escribe el dialogo para cada personaje.", "Entrenador de debates: \"Quiero que actues como un debatidor. Te proporcionare algunos temas relacionados con eventos reales y tu tarea sera investigar ambos lados de los debates, presentar argumentos validos para cada lado y refutar puntos de vista opuestos", "Aprendizaje basado en escenarios. Prompt: \"Crea una serie de escenarios hipoteticos que me permitan aplicar conocimientos y habilidades relacionados con tema o habilidad , fomentando las habilidades de resolucion de problemas y la comprension practica", "Genera tacticas de referencia por IA. Prompt: \"Analizar producto y generar 10 ideas unicas sobre como alentar a los clientes a recomendar a otros. Las ideas deben centrarse en agregar valor a los clientes existentes como recompensa por sus referencias. producto Insertar aqui", "Ventas adicionales con marketing por correo electronico usando IA. Prompt: \"Generar ideas sobre como usar el marketing por correo electronico para negocios para retener a los clientes existentes y alentar las compras repetidas de linea de productos . Negocio Insertar aqui Linea de productos Insertar aqui", "Responde a las objeciones del producto con IA. Prompt: \"Considera las posibles objeciones a producto servicio y proporciona instrucciones paso a paso sobre como responder a esas objeciones de una manera que hara que a los clientes les guste producto servicio . servicio Insertar aqui", "Fomentar la adopcion de la IA dentro de una organizacion: \"Proporcionar un plan paso a paso para que un consultor de IA fomente la adopcion de la IA dentro de la organizacion de un cliente, incluyendo capacitacion, gestion del cambio y superar la resistencia.", "Crea una campania exitosa de marketing por correo electronico. Prompt: \" Proporciona una breve descripcion de su publico objetivo y producto o servicio . Guiame en el desarrollo de una campania de marketing por correo electronico basada en el marco de la propuesta de valor del cliente", "Ejecuta una estrategia ganadora de lanzamiento de productos. Prompt: \" Proporciona una breve descripcion de tu producto y publico objetivo . Ayudame a crear una estrategia de lanzamiento de producto, empleando la formula de lanzamiento de producto para generar entusiasmo y ventas", "Gestionar proyectos de IA. Prompt: \"Crea una guia paso a paso para que un consultor de IA gestione un proyecto de IA, desde el inicio hasta su finalizacion, incluida la planificacion, la gestion de equipos, la gestion de riesgos y la generacion de informes de progreso", "Proposito de tu pregunta: Indica claramente el proposito de tu consulta. Este es tu \"Por que\". Agregar el proposito ayuda a ChatGPT a ajustar su respuesta. Preguntas complementarias: Si es necesario, haz preguntas adicionales para obtener respuestas mas refinadas. Asi como explorar subtemas relacionados con tu pregunta original.", "AI te puede generar el Esquema de una Conferencia Prompt: \"Crea un esquema que cubra todos los temas y menciona el limite de tiempo para cada tema estrictamente de una hora en total. Si puedes hacer algo mas para mi conferencia como invitado, estare encantado de aceptar tu ayuda.", "Voy a entrenarte para que te conviertas en una Maquina Generadora de Ideas. Te dare el tema y el incentivo, y 14 enfoques diferentes probados para ideas de titulares. Y tu me devolveras 14 ideas de titulares escritas exclusivamente para ese mismo tema e incentivo, pero aplicadas de 14 maneras diferentes.", "Encadenamiento de ordenes. Prompt1: \"Escribe una historia corta sobre un cientifico que viaja en el tiempo. Genera un esquema de la historia. Prompt2: Haz un bosquejo de una historia corta sobre un cientifico que viaja en el tiempo. Prompt3: Amplia cada punto del esquema. Prompt4: Escribe un parrafo detallado sobre punto del esquema", "Critica a ChatGPT. Pidee a ChatGPT que haga algo, luego, una vez que se reciba el resultado, solicita criticarlo. Prompt1: Actuar como X . Su trabajo es Y Prompt2: Ahora actua como critico. Critica los titulos anteriores y convence de por que son malos (respuesta en vinietas)", "Asigna a ChatGPT un rol especifico para generar respuestas desde una perspectiva unica. Prompt: como consultor de marketing experimentado , proporciona tres estrategias para promocionar una nueva aplicacion de acondicionamiento fisico dirigida a profesionales ocupados", "Desarrolla un calendario de marketing de contenido. Prompt: \"Estoy planificando mi marketing de contenido en insertar industria . Necesito un calendario bien estructurado que se alinee con los objetivos y que contenga las necesidades de la audiencia. Puede guiarme en la creacion de un calendario de marketing de contenido que impulse el engagement?", "Construye y manten relaciones con personas influyentes. Prompt: \"Quiero colaborar con personas influyentes en insertar industria . Construir y mantener estas relaciones puede mejorar el alcance de mi marca. Me puedes guiar para identificar y trabajar con personas influyentes que se alineen con mi marca?", "Realiza chequeos regulares de salud comercial. Prompt: \"Estoy implementando controles regulares para mi negocio en insertar industria . Estas evaluaciones aseguran la alineacion con los objetivos e identifican areas de mejora. Me puedes ayudar a desarrollar un enfoque sistematico para estos controles?", "Explorar e implementar soluciones de automatizacion. Prompt: \"Estoy considerando soluciones de automatizacion para mi negocio en insertar industria . Desde marketing hasta operaciones, la automatizacion puede impulsar la eficiencia. Puede ayudarme a identificar e implementar las herramientas de automatizacion adecuadas?", "Crea y supervisa un programa de marketing de afiliados. Prompt: \"Estoy planificando un programa de marketing de afiliacion en insertar industria . La gestion de las relaciones, el seguimiento y el cumplimiento son consideraciones clave. Puedes guiarme en la creacion y gestion de un programa de afiliados exitoso?", "Disenia un logotipo y una identidad de marca atractivos. Prompt: \"Necesito un logotipo memorable para mi marca en insertar industria . Los elementos visuales deben alinearse con mis valores y destacarse. Puedes guiarme en la creacion de un logotipo que contenga la esencia de mi marca?", "Establecer presencia en las redes sociales. Prompt: \"Quiero crear una fuerte presencia en las redes sociales en insertar industria . Mi objetivo es construir una comunidad y contenido atractivo. Puedes guiarme para seleccionar las plataformas y la estrategia de contenido adecuadas?", "Analiza y optimiza la experiencia del usuario de tu sitio web (UX). Prompt: \"Estoy centrado en la experiencia del usuario de mi sitio web en insertar industria . Analizar el comportamiento del usuario y realizar los ajustes necesarios para mejorar. Puedes ayudarme a optimizar la UX de mi sitio web?", "Desarrollar descripciones de productos o servicios. Prompt: \"Estoy elaborando descripciones para mis ofertas en insertar industria . Deben ser convincentes, claras y alineadas con mi marca. Puedes ayudarme a escribir descripciones de productos o servicios que se vendan?"]};
const I18N={
 es:{title:'Prompt Typing Test',lang:'Idioma',theme:'Tema',t_dark:'Oscuro',t_light:'Claro',font:'Tamaño de letra',next:'Nuevo prompt',
  gross:'WPM bruto',net:'WPM neto',acc:'Precisión',err:'Errores',log:'Bitácora',time:'Hora',chars:'Chars',clear:'Borrar bitácora',
  best:'Mejor',hint:'Haz clic en el texto y empieza a escribir. Tab = nuevo prompt.'},
 en:{title:'Prompt Typing Test',lang:'Language',theme:'Theme',t_dark:'Dark',t_light:'Light',font:'Font size',next:'New prompt',
  gross:'Gross WPM',net:'Net WPM',acc:'Accuracy',err:'Errors',log:'Log',time:'Time',chars:'Chars',clear:'Clear log',
  best:'Best',hint:'Click the text and start typing. Tab = new prompt.'}
};
function T(k){return I18N[document.documentElement.lang==='en'?'en':'es'][k];}
function applyLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=I18N[l][e.dataset.i18n];});
}
function setCookie(n,v,d){const e=new Date(Date.now()+d*864e5).toUTCString();
  document.cookie=n+'='+encodeURIComponent(v)+'; expires='+e+'; SameSite=Lax; path=/';}
function getCookie(n){const m=document.cookie.match('(?:^|; )'+n+'=([^;]*)');return m?decodeURIComponent(m[1]):null;}

const $=id=>document.getElementById(id);
let target='',pos=0,total=0,errors=0,correct=0,start=null,end=null,done=false,states=[];
let promptLang='es',LOG=[];try{LOG=JSON.parse(localStorage.getItem('typing_log')||'[]');}catch(e){}
function saveLog(){try{localStorage.setItem('typing_log',JSON.stringify(LOG));}catch(e){}}
function calc(){
  const min=start?((end||performance.now())-start)/60000:0;
  return {gross:min>0?(total/5)/min:0,net:min>0?Math.max(0,((total-errors)/5)/min):0,acc:total>0?correct/total*100:100};
}
function recordLog(){
  if(total===0)return;
  const m=calc();
  LOG.push({t:Date.now(),lang:promptLang,net:m.net,gross:m.gross,acc:m.acc,err:errors,chars:total});
  saveLog();
}
function renderLog(){
  const row=(e,n,cls)=>'<tr class="'+cls+'"><td>'+n+'</td><td>'+new Date(e.t).toLocaleTimeString()+'</td><td>'+e.lang.toUpperCase()+'</td><td>'+e.net.toFixed(0)+'</td><td>'+e.gross.toFixed(0)+'</td><td>'+e.acc.toFixed(1)+'%</td><td>'+e.err+'</td><td>'+e.chars+'</td></tr>';
  let html='';
  if(LOG.length){
    let bi=0;LOG.forEach((e,i)=>{const b=LOG[bi];if(e.net>b.net||(e.net===b.net&&e.acc>b.acc))bi=i;});
    html+=row(LOG[bi],T('best'),'best');
    for(let i=LOG.length-1;i>=0;i--)html+=row(LOG[i],i+1,'');
  }
  $('logb').innerHTML=html;
}

function setFont(px){px=Math.min(48,Math.max(12,parseInt(px)||24));
  const r=document.documentElement.style;r.setProperty('--fs',px+'px');r.setProperty('--lh',(px*1.47).toFixed(1)+'px');
  $('fs').value=px;$('fsv').textContent=px+'px';setCookie('app_font',px,365);}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);setCookie('app_theme',t,365);$('theme').value=t;}
function newPrompt(){
  recordLog();
  promptLang=$('lang').value;
  const list=DATA[promptLang];
  target=list[Math.floor(Math.random()*list.length)];
  pos=total=errors=correct=0;start=null;end=null;done=false;states=new Array(target.length).fill('');
  $('hid').value='';render();stats();renderLog();$('hid').focus();
}
function render(){
  const esc=c=>c.replace('&','&amp;').replace('<','&lt;');
  const ch=i=>'<span class="'+(states[i]||'')+(i===pos&&!done?' cur':'')+'">'+(target[i]===' '?' ':esc(target[i]))+'</span>';
  let html='',i=0;
  while(i<target.length){
    if(target[i]===' '){html+=ch(i);i++;continue;}
    let w='';
    while(i<target.length&&target[i]!==' '){w+=ch(i);i++;}
    html+='<span class="w">'+w+'</span>';
  }
  $('text').innerHTML=html;
  const c=$('text').querySelector('.cur');if(c)c.scrollIntoView({block:'nearest'});
}
function stats(){
  const m=calc();
  $('gw').textContent=m.gross.toFixed(0);$('nw').textContent=m.net.toFixed(0);
  $('ac').textContent=m.acc.toFixed(1);$('er').textContent=errors;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();newPrompt();return;}
  if(done||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){e.preventDefault();if(pos>0){pos--;states[pos]='';render();}return;}
  if(e.key.length!==1)return;
  e.preventDefault();
  if(start===null)start=performance.now();
  total++;
  if(e.key===target[pos]){correct++;states[pos]='ok';}else{errors++;states[pos]='bad';}
  pos++;
  if(pos>=target.length){done=true;end=performance.now();}
  render();stats();
});
setInterval(()=>{if(start&&!done)stats();},200);
$('text').addEventListener('click',()=>$('hid').focus());
$('clr').addEventListener('click',()=>{LOG=[];saveLog();renderLog();});
$('fs').addEventListener('input',e=>setFont(e.target.value));
$('next').addEventListener('click',newPrompt);
$('lang').addEventListener('change',()=>{setCookie('app_lang',$('lang').value,365);applyLang($('lang').value);newPrompt();});
$('theme').addEventListener('change',e=>setTheme(e.target.value));
$('lang').value=getCookie('app_lang')==='en'?'en':'es';
$('theme').value=document.documentElement.getAttribute('data-theme');
applyLang($('lang').value);
setFont(getCookie('app_font')||24);
newPrompt();
</script>
</body>
